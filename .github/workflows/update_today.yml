name: update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: write
  actions: read
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        pip install requests
    - name: update yesterday
      env:
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        yesterday=$(date -d "yesterday" +%Y-%m-%d)
        python run.py --date "$yesterday" | tee /tmp/update_yesterday.log
    - name: Send yesterday notification
      if: env.DINGTALK_WEBHOOK_URL != ''
      env:
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
      run: |
        yesterday=$(date -d "yesterday" +%Y-%m-%d)
        python -c "
import os
import sys
sys.path.insert(0, '.')
from run import notify_daily_report
notify_daily_report('$yesterday')
" 2>/dev/null || echo "Notify skipped"
    - name: update today
      env:
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        today=$(date +%Y-%m-%d)
        python run.py --date "$today" | tee /tmp/update_today.log
    - name: Send today notification
      if: env.DINGTALK_WEBHOOK_URL != ''
      env:
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
      run: |
        today=$(date +%Y-%m-%d)
        python -c "
import os
import sys
sys.path.insert(0, '.')
from run import notify_daily_report
notify_daily_report('$today')
" 2>/dev/null || echo "Notify skipped"
    - name: Commit and push if changed
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add .
        git diff-index --quiet HEAD || git commit -m "Auto update: $(date +%Y-%m-%d\ %H:%M:%S)"
        git push