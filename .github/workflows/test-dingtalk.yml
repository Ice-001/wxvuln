name: test-dingtalk

on:
  workflow_dispatch:
    inputs:
      test_date:
        description: '测试日期 (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  test-notify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        pip install requests
    - name: Send test notification
      env:
        DINGDING_ACCESS_TOKEN: ${{ secrets.DINGDING_ACCESS_TOKEN }}
        DINGDING_SECRET: ${{ secrets.DINGDING_SECRET }}
      run: python test_dingtalk.py
    - name: Send daily report notification
      if: github.event.inputs.test_date != ''
      env:
        DINGDING_ACCESS_TOKEN: ${{ secrets.DINGDING_ACCESS_TOKEN }}
        DINGDING_SECRET: ${{ secrets.DINGDING_SECRET }}
      run: python test_dingtalk.py "${{ github.event.inputs.test_date }}"